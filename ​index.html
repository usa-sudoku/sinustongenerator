<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinuston Generator (Unabhängige Buttons)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-1: #38bdf8;
            --accent-2: #a855f7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .tone-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.2rem;
            border-left: 4px solid var(--accent-1);
        }

        .tone-box.tone-2 {
            border-left-color: var(--accent-2);
        }

        .tone-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            display: block;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        input[type="number"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-size: 1.1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle {
            background-color: #334155;
            color: var(--text-color);
        }

        .btn-toggle.active {
            background-color: #ef4444; /* Rot zum Stoppen */
            color: white;
        }

        .tone-box:first-of-type .btn-toggle:not(.active) {
            background-color: #0284c7; /* Blau für Ton 1 */
            color: white;
        }

        .tone-box:last-of-type .btn-toggle:not(.active) {
            background-color: #9333ea; /* Lila für Ton 2 */
            color: white;
        }

        .btn-toggle:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sinuston Generator</h1>

    <!-- Ton 1 -->
    <div class="tone-box tone-1">
        <span class="tone-title">Ton 1</span>
        <div class="input-group">
            <label for="freq1">Frequenz (Hz):</label>
            <input type="number" id="freq1" value="440" min="1" max="20000" step="1">
        </div>
        <button id="btn1" class="btn-toggle">Ton 1 starten</button>
    </div>

    <!-- Ton 2 -->
    <div class="tone-box tone-2">
        <span class="tone-title">Ton 2</span>
        <div class="input-group">
            <label for="freq2">Frequenz (Hz):</label>
            <input type="number" id="freq2" value="880" min="1" max="20000" step="1">
        </div>
        <button id="btn2" class="btn-toggle">Ton 2 starten</button>
    </div>
</div>

<script>
    let audioCtx = null;

    // Zustände und Knoten für Ton 1
    let osc1 = null, gain1 = null;
    let isPlaying1 = false;

    // Zustände und Knoten für Ton 2
    let osc2 = null, gain2 = null;
    let isPlaying2 = false;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // --- Steuerung Ton 1 ---
    const btn1 = document.getElementById('btn1');
    const freq1Input = document.getElementById('freq1');

    btn1.addEventListener('click', () => {
        const ctx = getAudioContext();
        const freq = parseFloat(freq1Input.value) || 440;

        if (!isPlaying1) {
            // Starten
            osc1 = ctx.createOscillator();
            gain1 = ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, ctx.currentTime);
            gain1.gain.setValueAtTime(0.5, ctx.currentTime); // Feste angenehme Lautstärke

            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start();

            isPlaying1 = true;
            btn1.textContent = 'Ton 1 stoppen';
            btn1.classList.add('active');
        } else {
            // Stoppen
            osc1.stop();
            osc1.disconnect();
            isPlaying1 = false;
            btn1.textContent = 'Ton 1 starten';
            btn1.classList.remove('active');
        }
    });

    // Frequenz live anpassen, falls Ton läuft
    freq1Input.addEventListener('input', () => {
        if (isPlaying1 && osc1) {
            const freq = parseFloat(freq1Input.value) || 440;
            osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);
        }
    });


    // --- Steuerung Ton 2 ---
    const btn2 = document.getElementById('btn2');
    const freq2Input = document.getElementById('freq2');

    btn2.addEventListener('click', () => {
        const ctx = getAudioContext();
        const freq = parseFloat(freq2Input.value) || 880;

        if (!isPlaying2) {
            // Starten
            osc2 = ctx.createOscillator();
            gain2 = ctx.createGain();

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq, ctx.currentTime);
            gain2.gain.setValueAtTime(0.5, ctx.currentTime);

            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start();

            isPlaying2 = true;
            btn2.textContent = 'Ton 2 stoppen';
            btn2.classList.add('active');
        } else {
            // Stoppen
            osc2.stop();
            osc2.disconnect();
            isPlaying2 = false;
            btn2.textContent = 'Ton 2 starten';
            btn2.classList.remove('active');
        }
    });

    // Frequenz live anpassen, falls Ton läuft
    freq2Input.addEventListener('input', () => {
        if (isPlaying2 && osc2) {
            const freq = parseFloat(freq2Input.value) || 880;
            osc2.frequency.setValueAtTime(freq, audioCtx.currentTime);
        }
    });
</script>

</body>
</html>
